<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  .main { padding: 28px 64px 6px; }
  h1 { font-size: 56px; line-height: 1.12; overflow: visible; }
  .sub { font-size: 30px; margin-top: 8px; }
  .moon-wrap { margin: 22px auto 0; width: 952px; }
  .moon { width: 952px; height: 952px; display: block; background: #111; }
  .caption {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    font-size: 26px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.3;
  }
  .caption .swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 3.5px solid #F5C400;
    flex: 0 0 24px;
    box-shadow: 0 0 0 2px #2a2200;
  }
  .footer { padding: 14px 64px 16px; font-size: 22px; line-height: 1.4; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar"></div>
  <div class="main">
    <div class="kicker">KI-Experimente</div>
    <h1>Krater Clavius</h1>
    <div class="sub">17 markierte Krater, Score ab 0,7</div>
    <div class="moon-wrap">
      <img class="moon" src="img/clavius.png" alt="Krater Clavius mit vom Modell markierten Kratern" width="952" height="952">
      <div class="caption"><span class="swatch" aria-hidden="true"></span>Goldene Kreise: vom Modell markierte Krater</div>
    </div>
  </div>
  <div class="footer">
    <strong>Quellen.</strong> Mondbild: LROC WAC-Mosaik 100&nbsp;m (NASA/GSFC/ASU, USGS), gemeinfrei. Kreise: offenes NASA-IBM-Modell, eigene Nachstellung, Schwelle 0,7.
  </div>
</div>
</body>
</html>
